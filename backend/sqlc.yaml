version: "2"

sql:
  - engine: "postgresql"

    schema:
      - "../database/sql/*.sql"

    queries:
      - "./internal/db/queries/*.sql"

    gen:
      go:
        package: "generated"
        out: "./internal/db/generated"

        sql_package: "pgx/v5"

        emit_json_tags: true
        emit_empty_slices: true
        emit_interface: false
        emit_exact_table_names: false